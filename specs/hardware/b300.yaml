name: B300 (Blackwell Ultra) 288GB
# Verified via web search against multiple independent sources (NVIDIA's own
# GB300 NVL72 page, plus third-party GPU spec aggregators that agreed with
# each other and with a rack-level cross-check): NVIDIA's page states the
# GB300 NVL72 rack (72 GPUs) delivers ~720 PFLOPS FP8 *with sparsity* --
# divided by 72 GPUs and by 2 (dense = sparsity/2) gives 5 PFLOPS/GPU dense,
# matching third-party per-GPU figures directly. Shipped January 2026.
memory_gb: 288
memory_bandwidth_gbs: 8000
peak_flops:
  bf16: 2500e12   # NOT directly sourced -- estimated as fp8/2, the same dense
                  # doubling ratio confirmed for this project's own b200.yaml
                  # (1125e12 bf16 / 2250e12 fp8, exactly 2x). No source gave a
                  # standalone B300 bf16 number; flagged as derived, not measured.
  fp8: 5000e12    # dense (not with-sparsity) -- see sourcing note above
interconnect:
  type: nvlink
  bandwidth_gbs: 1800   # NVLink 5, same per-GPU domain bandwidth as b200.yaml
pcie_gbs: 256           # PCIe Gen6 x16 -- 2x b200.yaml's Gen5 figure (128), independently corroborated
